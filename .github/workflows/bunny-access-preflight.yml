name: Bunny local-only deployment metadata preflight
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_BUNNY_APP_ID: ${{ vars.BUNNY_MC_APP_ID != '' }}
      HAS_BACKUP_MODE: ${{ vars.BUNNY_MC_BACKUP_ENABLED == 'true' }}
    steps:
      - name: Report public metadata only, never request Bunny account credentials
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## KumaEdge local-only Bunny credential boundary"
            echo "GitHub never receives Bunny account API keys and cannot deploy."
            echo "Bunny App ID is configured: $HAS_BUNNY_APP_ID"
            echo "Optional SQLite backup selected: $HAS_BACKUP_MODE"
            echo "Manual local install and production acceptance remain required."
          } >> "$GITHUB_STEP_SUMMARY"
