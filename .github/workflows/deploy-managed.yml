name: Bunny Managed - verified release preflight (NO DEPLOY)
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tested image tag (40-character commit SHA from main)'
        required: true
        type: string
permissions:
  contents: read
  packages: read
  actions: read
jobs:
  deploy:
    # Read-only verification. Do NOT attach Bunny account secrets here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate SHA is from the protected main branch
        shell: bash
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'Production dispatch must use main'; exit 1; }
          [[ "$TAG" =~ ^[a-f0-9]{40}$ ]] || { echo 'Expected full commit SHA'; exit 1; }
          git merge-base --is-ancestor "$TAG" origin/main || { echo 'Image SHA is not in main'; exit 1; }
      - name: Validate non-secret release metadata only
        shell: bash
        env:
          APP_ID: ${{ vars.BUNNY_MC_APP_ID }}
          BACKUP_MODE: ${{ vars.BUNNY_MC_BACKUP_ENABLED }}
        run: |
          set -euo pipefail
          [[ "$BACKUP_MODE" == "true" || -z "$BACKUP_MODE" || "$BACKUP_MODE" == "false" ]] || {
            echo "BUNNY_MC_BACKUP_ENABLED must be true, false or empty"
            exit 2
          }
          [[ -n "$APP_ID" ]] || echo "::notice::Bunny App ID not configured; no Bunny account access requested."
      - name: Require a successful official main publishing run for the exact SHA
        id: publisher
        shell: bash
        env:
          TAG: ${{ inputs.image_tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-provenance.mjs "$TAG" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release image exists before operator approval
        shell: bash
        env:
          TAG: ${{ inputs.image_tag }}
          WITH_BACKUP: ${{ vars.BUNNY_MC_BACKUP_ENABLED }}
        run: |
          set -euo pipefail
          repo_lower="${GITHUB_REPOSITORY,,}"
          docker manifest inspect "ghcr.io/$repo_lower:$TAG" > /dev/null || {
            echo "GHCR main image missing/inaccessible"; exit 1;
          }
          if [[ "${WITH_BACKUP:-}" == "true" ]]; then
            docker manifest inspect "ghcr.io/${repo_lower}-backup:$TAG" > /dev/null || {
              echo "GHCR SQLite backup image missing/inaccessible"; exit 1;
            }
          fi
      - name: Download publisher digest evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.image_tag }}
          PUBLISH_RUN: ${{ steps.publisher.outputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$PUBLISH_RUN" =~ ^[1-9][0-9]*$ ]] || exit 2
          mkdir -p "$RUNNER_TEMP/kumaedge-release"
          gh run download "$PUBLISH_RUN" --repo "$GITHUB_REPOSITORY" --name "kumaedge-oci-digests-$TAG" --dir "$RUNNER_TEMP/kumaedge-release"
      - name: Verify OCI tags match the published digest evidence
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: node scripts/oci-release-evidence.mjs verify "$RUNNER_TEMP/kumaedge-release/evidence.json"
      - name: Summarize read-only release checks (NO Bunny changes)
        shell: bash
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          {
            echo "## Verified published images for SHA $TAG"
            echo "GHCR provenance, both digest manifests and non-secret metadata checked."
            echo "NO Bunny API requests, container updates or paid resource changes."
            echo "Bunny account credentials must remain LOCAL ONLY."
            echo "Use docs/BUNNY_LOCAL_CREDENTIALS.md for approved local deployment."
          } >> "$GITHUB_STEP_SUMMARY"
