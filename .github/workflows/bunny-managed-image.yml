name: Bunny Managed - build and verify
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.github/workflows/bunny-managed-image.yml'
      - 'scripts/smoke-managed.sh'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/bunny-managed-image.yml'
      - 'scripts/smoke-managed.sh'
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build fresh Uptime Kuma 2.x
        run: docker build --pull -t kumaedge:smoke .
      - name: Test web server and persistent data restart
        run: bash scripts/smoke-managed.sh kumaedge:smoke
  publish:
    needs: smoke
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push immutable commit tag
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64
          tags: ghcr.io/aitishnyk/kumaedge:${{ github.sha }}
