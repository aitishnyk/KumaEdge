name: Bunny Managed - manual production deploy
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tested image tag (40-character commit SHA from main)'
        required: true
        type: string
permissions:
  contents: read
  packages: read
  actions: read
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate SHA is from the protected main branch
        shell: bash
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'Production dispatch must use main'; exit 1; }
          [[ "$TAG" =~ ^[a-f0-9]{40}$ ]] || { echo 'Expected full commit SHA'; exit 1; }
          git merge-base --is-ancestor "$TAG" origin/main || { echo 'Image SHA is not in main'; exit 1; }
      - name: Verify Bunny deployment prerequisites without leaking values
        shell: bash
        env:
          APP_ID: ${{ vars.BUNNY_MC_APP_ID }}
          BUNNY_KEY: ${{ secrets.BUNNYNET_API_KEY }}
          BACKUP_MODE: ${{ vars.BUNNY_MC_BACKUP_ENABLED }}
        run: |
          set -euo pipefail
          [[ -n "$APP_ID" && -n "$BUNNY_KEY" ]] || {
            echo "Bunny App ID and API key must both be configured in the protected environment"
            exit 2
          }
          [[ "$BACKUP_MODE" == "true" || -z "$BACKUP_MODE" || "$BACKUP_MODE" == "false" ]] || {
            echo "BUNNY_MC_BACKUP_ENABLED must be either true or false"
            exit 2
          }
      - name: Require a successful official main publishing run for the exact SHA
        id: publisher
        shell: bash
        env:
          TAG: ${{ inputs.image_tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-provenance.mjs "$TAG" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release image exists before Bunny changes
        shell: bash
        env:
          TAG: ${{ inputs.image_tag }}
          WITH_BACKUP: ${{ vars.BUNNY_MC_BACKUP_ENABLED }}
        run: |
          set -euo pipefail
          repo_lower="${GITHUB_REPOSITORY,,}"
          docker manifest inspect "ghcr.io/$repo_lower:$TAG" > /dev/null || {
            echo "GHCR main image missing/inaccessible"; exit 1;
          }
          if [[ "${WITH_BACKUP:-}" == "true" ]]; then
            docker manifest inspect "ghcr.io/${repo_lower}-backup:$TAG" > /dev/null || {
              echo "GHCR SQLite backup image missing/inaccessible"; exit 1;
            }
          fi
      - name: Download publisher digest evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.image_tag }}
          PUBLISH_RUN: ${{ steps.publisher.outputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$PUBLISH_RUN" =~ ^[1-9][0-9]*$ ]] || exit 2
          mkdir -p "$RUNNER_TEMP/kumaedge-release"
          gh run download "$PUBLISH_RUN" --repo "$GITHUB_REPOSITORY" --name "kumaedge-oci-digests-$TAG" --dir "$RUNNER_TEMP/kumaedge-release"
      - name: Verify OCI tags match the published digest evidence
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: node scripts/oci-release-evidence.mjs verify "$RUNNER_TEMP/kumaedge-release/evidence.json"
      - name: Deploy prebuilt immutable tag to Bunny
        uses: BunnyWay/actions/container-update-image@4b22fe0b319386b3913117daf97729409dd0a6ef
        with:
          app_id: ${{ vars.BUNNY_MC_APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: kumaedge
          image_tag: ${{ inputs.image_tag }}
      - name: Update optional SQLite backup worker to the same tested SHA
        if: vars.BUNNY_MC_BACKUP_ENABLED == 'true'
        uses: BunnyWay/actions/container-update-image@4b22fe0b319386b3913117daf97729409dd0a6ef
        with:
          app_id: ${{ vars.BUNNY_MC_APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: sqlite-offsite-backup
          image_tag: ${{ inputs.image_tag }}
