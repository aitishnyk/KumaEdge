name: Bunny Managed - build, test and publish
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.backup'
      - 'scripts/bunny-db-backup-worker.py'
      - '.github/workflows/bunny-managed-image.yml'
      - 'scripts/smoke-managed.sh'
      - 'scripts/smoke-disaster-recovery.sh'
      - 'scripts/volume-backup.py'
      - 'scripts/check-production.mjs'
      - 'src/acceptance/**'
      - '.github/upstream-state.json'
      - 'scripts/guard-ghcr-publish.mjs'
      - 'scripts/verify-release-provenance.mjs'
      - 'scripts/oci-release-evidence.mjs'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.backup'
      - 'scripts/bunny-db-backup-worker.py'
      - '.github/workflows/bunny-managed-image.yml'
      - 'scripts/smoke-managed.sh'
      - 'scripts/smoke-disaster-recovery.sh'
      - 'scripts/volume-backup.py'
      - 'scripts/check-production.mjs'
      - 'src/acceptance/**'
      - '.github/upstream-state.json'
      - 'scripts/guard-ghcr-publish.mjs'
      - 'scripts/verify-release-provenance.mjs'
      - 'scripts/oci-release-evidence.mjs'
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: kumaedge-ghcr-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate pinned upstream pulls to Docker Hub when configured
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
            echo "Authenticated Docker Hub upstream pulls"
          elif [[ -z "$DOCKERHUB_USERNAME" && -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::notice::Docker Hub pull is anonymous; shared CI runners may receive HTTP 429. Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as Actions secrets."
          else
            echo "::error::Configure both DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, or neither"
            exit 2
          fi
      - name: Pull and build upstream runtime
        run: docker build --pull -t kumaedge:smoke .
      - name: Build optional encrypted backup sidecar
        run: |
          docker build --pull -f Dockerfile.backup -t kumaedge-backup:smoke .
          docker run --rm --entrypoint age kumaedge-backup:smoke --version
      - name: Real HTTP and persistent volume restart smoke
        run: bash scripts/smoke-managed.sh kumaedge:smoke
      - name: Install age for real-container disaster recovery rehearsal
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
      - name: Encrypted offline full-volume recovery to a NEW Docker volume
        run: bash scripts/smoke-disaster-recovery.sh kumaedge:smoke
      - name: Determine fork-compatible GHCR repository
        id: registry
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR after smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail-closed GHCR manifest state (unknown != missing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: image_guard
        run: node scripts/guard-ghcr-publish.mjs
      - name: Tag and publish the EXACT tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.image_guard.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.registry.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker tag kumaedge:smoke "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
          BACKUP_IMAGE="${IMAGE}-backup"
          docker tag kumaedge-backup:smoke "$BACKUP_IMAGE:$GITHUB_SHA"
          docker push "$BACKUP_IMAGE:$GITHUB_SHA"
      - name: Record published OCI manifest digests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.image_guard.outputs.publish == 'true'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: node scripts/oci-release-evidence.mjs record "$RUNNER_TEMP/evidence.json"
      - name: Upload publisher digest evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.image_guard.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kumaedge-oci-digests-${{ github.sha }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 90
